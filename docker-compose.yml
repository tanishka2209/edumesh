services:
  # Public entry point. It serves the UI and coordinates all three subject services.
  gateway:
    build: .
    command: python -m uvicorn gateway:app --host 0.0.0.0 --port 8000
    ports:
      - "18400:8000"
    environment:
      ML_URL: http://ml:8000
      DBMS_URL: http://dbms:8000
      CLOUD_URL: http://cloud:8000
    env_file:
      - .env
    depends_on:
      ml:
        condition: service_healthy
      dbms:
        condition: service_healthy
      cloud:
        condition: service_healthy
    restart: unless-stopped

  # Independent Machine Learning subject service.
  ml:
    build: .
    command: python -m uvicorn service:app --host 0.0.0.0 --port 8000
    environment:
      SUBJECT: ML
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Independent Database Management Systems subject service.
  dbms:
    build: .
    command: python -m uvicorn service:app --host 0.0.0.0 --port 8000
    environment:
      SUBJECT: DBMS
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Independent Cloud Computing subject service.
  cloud:
    build: .
    command: python -m uvicorn service:app --host 0.0.0.0 --port 8000
    environment:
      SUBJECT: CLOUD
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
